name: CI y despliegue

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; si llega uno nuevo, el anterior se cancela.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, tipos y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas del motor
        run: npm run test

      - name: Construir (incluye la comprobacion de tipos)
        run: npm run build
        env:
          DEPLOY_TARGET: gh-pages

      - name: Empaquetar para Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  desplegar:
    name: Publicar en GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: verificar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Desplegar
        id: despliegue
        uses: actions/deploy-pages@v5
